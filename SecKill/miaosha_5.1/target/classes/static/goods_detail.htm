<!DOCTYPE HTML>
<html>
<head>
    <title>商品详情</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<!-- 1.商品详情静态化 -->
    <!-- jquery -->
    <script type="text/javascript" src="/js/jquery.min.js"></script>
    <!-- bootstrap -->
    <link rel="stylesheet" type="text/css" href="/bootstrap/css/bootstrap.min.css" />
    <script type="text/javascript" src="/bootstrap/js/bootstrap.min.js"></script>
    <!-- jquery-validator -->
    <script type="text/javascript" src="/jquery-validation/jquery.validate.min.js"></script>
    <script type="text/javascript" src="/jquery-validation/localization/messages_zh.min.js"></script>
    <!-- layer -->
    <script type="text/javascript" src="/layer/layer.js"></script>
    <!-- md5.js -->
    <script type="text/javascript" src="/js/md5.min.js"></script>
    <!-- common.js -->
    <script type="text/javascript" src="/js/common.js"></script>

        html,body{
            height:100%;
            width:100%;
        }
        body{
            background:url('/img/bg2.jpg') no-repeat;
            background-size:100% 100%;
        }
        #goodslist td{
            border-top:1px solid #39503f61;
        }
    </style> -->
</head>
<body>
	<div class="panel panel-default">
		<div class="panel-heading">秒杀商品详情</div>
		<div id="userTipdiv" class="panel-body">
			<span id="userTip">
				您还没有登录，请登录后再操作&nbsp;&nbsp;
				<button class="btn" onclick="go_login()">登录</button>
			</span>
		</div>
		<table class="table" id="goodslist">
			<tr>  
		        <td>商品名称</td>  
		        <td colspan="3" id="goodsName"></td> 
			</tr>  
			<tr>  
				<td>商品图片</td>  
				<td colspan="3"><img id="goodsImg" width="200" height="200" /></td>  
			</tr>
			<tr>  
		        <td>秒杀开始时间</td>  
		        <td id="startTime"></td>
				<!-- 设置秒杀状态 -->
		        <td>	
		        	<input type="hidden" id="remainSeconds" />
		        	<span id="miaoshaTip"></span>
		        </td>
		        <td>
		        	<!--<form id="miaoshaForm" method="post" action="/miaosha/do_miaosha">
		        		<button class="btn btn-primary btn-block" type="submit" id="buyButton">立即秒杀</button>
		        		<input type="hidden" name="goodsId"  id="goodsId" />
		        	</form>-->
		        	<!-- 2.秒杀静态化 -->
		        	<div class="row">
		        		<div class="form-inline">
				        	<img id="verifyCodeImg" width="80" height="32" style="display:none" onclick="refreshVerifyCode()"/>
				        	<input id="verifyCode" class="form-control" style="display:none"/>
				        	<button class="btn btn-primary" type="button" id="buyButton"onclick="getMiaoshaPath()">立即秒杀</button>
		        		</div>
		        	</div>
		        	<input type="hidden" name="goodsId" id="goodsId" />
		        </td>
			</tr>
			<tr>  
		        <td>商品原价</td>  
		        <td colspan="3" id="goodsPrice"></td>  
			</tr>
			<tr>  
		        <td>秒杀价</td>  
		        <td colspan="3" id="miaoshaPrice"></td>  
			</tr>
			<tr>  
		        <td>库存数量</td>  
		        <td colspan="3" id="stockCount"></td>  
			</tr>
		</table>
	</div>
</body>
<script>
	//游客登录
	function go_login(){
		window.location.href="/login/to_login";
	}

	//秒杀接口地址隐藏
	function getMiaoshaPath(){
		var goodsId = $("#goodsId").val(); //获取商品id
		g_showLoading();
		$.ajax({
			url:"/miaosha/path",
			type:"GET",
			data:{
				goodsId:goodsId,
				verifyCode:$("#verifyCode").val() //传验证码值
			},
			success:function(data){
				if(data.code == 0){
					var path = data.data;
					doMiaosha(path);
				}else{
					layer.msg(data.msg);
				}
			},
			error:function(){
				layer.msg("客户端请求有误");
			}
		});
	}

	//轮询服务端：当秒杀请求被放入queue中后，由于MySQL处理能力有限，可能需要等待一段时间才能完成对秒杀请求的处理，这段时间前端会不断询问秒杀请求的处理结果
	function getMiaoshaResult(goodsId){
		g_showLoading();
		$.ajax({
			url:"/miaosha/result",
			type:"GET",
			data:{
				goodsId:$("#goodsId").val(),
				
			},
			success:function(data){
				if(data.code == 0){ //提交秒杀请求成功
					var result = data.data;
					if(result < 0){
						layer.msg("对不起，秒杀失败");
					}else if(result == 0){ //排队中，继续轮询
						setTimeout(function(){
							getMiaoshaResult(goodsId);
						}, 200); //50毫秒后再轮询一次
					}else{
						layer.confirm("恭喜你，秒杀成功！是否查看订单？", {btn:["确定","取消"]},
							function(){
								window.location.href="/order_detail.htm?orderId="+result;
							},
							function(){
								layer.closeAll();
							});
					}
				}else{ //提交秒杀请求失败
					layer.msg(data.msg);
				}
			},
			error:function(){
				layer.msg("客户端请求有误");
			}
		});
	}

	//2.秒杀静态化
	function doMiaosha(path){
		$.ajax({
			url:"/miaosha/"+path+"/do_miaosha",
			type:"POST",
			data:{
				goodsId:$("#goodsId").val(), //获取goodsId
			},
			success:function(data){
				if(data.code == 0){
					//window.location.href="/order_detail.htm?orderId="+data.data.id; //静态页面
					//轮询服务端：当秒杀请求被放入queue中后，由于MySQL处理能力有限，可能需要等待一段时间才能完成对秒杀请求的处理，这段时间前端会不断询问秒杀请求的处理结果
					getMiaoshaResult($("#goodsId").val()); //由于在缓存中预减商品，显示排队中，轮询服务端
				}else{
					layer.msg(data.msg);
				}
			},
			error:function(){
				layer.msg("客户端请求有误");
			}
		});
		
	}
	
	//1.商品详情静态化：渲染页面
	function render(detail){
		var miaoshaStatus = detail.miaoshaStatus;
		var remainSeconds = detail.remainSeconds;
		var goods = detail.goods;
		var user = detail.user;
		if(user){ //若已登录，能获取到用户，就把提示信息隐藏
			$("#userTip").hide();
			$("#userTipdiv").hide();
		}
		$("#goodsName").text(goods.goodsName);
		$("#goodsImg").attr("src", goods.goodsImg);
		$("#startTime").text(new Date(goods.startDate).format("yyyy-MM-dd hh:mm:ss"));
		$("#remainSeconds").val(remainSeconds);
		$("#goodsId").val(goods.id);
		$("#goodsPrice").text(goods.goodsPrice);
		$("#miaoshaPrice").text(goods.miaoshaPrice);
		$("#stockCount").text(goods.stockCount);
		countDown();
	}
	
	//页面初始化
	$(function(){
		//countDown();
		getDetail();
	});
	
	//1.商品详情静态化
	function getDetail(){
		var goodsId = g_getQueryString("goodsId"); //获取url参数(common.js)
		$.ajax({
			url:"/goods/detail/"+goodsId,
			type:"GET",
			success:function(data){
				if(data.code == 0){ //成功
					render(data.data); //根据服务端的数据，把页面渲染出了
				}else{ //失败
					layer.msg(data.msg); //把错误消息打印出来
				}
			},
			error:function(){
				layer.msg("客户端请求有误");
			}
		});
	}
	
	//秒杀倒计时
	function countDown(){
		var remainSeconds = $("#remainSeconds").val();
		var timeout;
		if(remainSeconds > 0){//秒杀还没开始，倒计时
			$("#buyButton").attr("disabled", true);
			$("#miaoshaTip").html("秒杀倒计时："+remainSeconds+"秒");
			timeout = setTimeout(function(){
				$("#countDown").text(remainSeconds - 1);
				$("#remainSeconds").val(remainSeconds - 1);
				countDown();
			},1000);
		}else if(remainSeconds == 0){//秒杀进行中
			$("#buyButton").attr("disabled", false);
			if(timeout){
				clearTimeout(timeout);
			}
			$("#miaoshaTip").html("秒杀进行中");
			//生成验证码
			$("#verifyCodeImg").attr("src", "/miaosha/verifyCode?goodsId="+$("#goodsId").val()); //生成验证码的地址
			$("#verifyCodeImg").show();
			$("#verifyCode").show();
		}else{//秒杀已经结束
			$("#buyButton").attr("disabled", true);
			$("#miaoshaTip").html("秒杀已经结束");
			$("#verifyCodeImg").hide();
			$("#verifyCode").hide();
		}
	}
	
	//刷新验证码：重新调用接口
	function refreshVerifyCode(){
		$("#verifyCodeImg").attr("src", "/miaosha/verifyCode?goodsId="+$("#goodsId").val()+"&timestamp="+new Date().getTime());
	}
</script>
</html>
