<!DOCTYPE HTML>
<!-- 定义一个th -->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>登录</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <!-- jquery -->
    <script type="text/javascript" th:src="@{/js/jquery.min.js}"></script>
    <!-- bootstrap -->
    <link rel="stylesheet" type="text/css" th:href="@{/bootstrap/css/bootstrap.min.css}" />
    <script type="text/javascript" th:src="@{/bootstrap/js/bootstrap.min.js}"></script>
    <!-- jquery-validator -->
    <script type="text/javascript" th:src="@{/jquery-validation/jquery.validate.min.js}"></script>
    <script type="text/javascript" th:src="@{/jquery-validation/localization/messages_zh.min.js}"></script>
    <!-- layer -->
    <script type="text/javascript" th:src="@{/layer/layer.js}"></script>
    <!-- md5.js -->
    <script type="text/javascript" th:src="@{/js/md5.min.js}"></script>
    <!-- common.js -->
    <script type="text/javascript" th:src="@{/js/common.js}"></script>
</head>

<body>
	<form name="loginForm" id="loginForm" method="post" style="width:50%; margin:0 auto">
		<h2 style="text-align:center; margin-bottom: 20px">用户登录</h2>
		<div class="form-group">
	       	<div class="row">
		       	<label class="form-label col-md-4">手机号码（11位）：</label>
		        <div class="col-md-5">
		        	<input id="mobile" name = "mobile" class="form-control" type="text" placeholder="手机号码" required="true"  minlength="11" maxlength="11" />
		    	</div>
		    	<div class="col-md-1">
		    	</div>
	    	</div>
	    </div>
	    
		<div class="form-group">
			<div class="row">
				<label class="form-label col-md-4">密码：</label>
				<div class="col-md-5">
		       		<input id="password" name="password" class="form-control" type="password"  placeholder="密码" required="true" minlength="6" maxlength="16" />
				</div>
	   		</div>
		</div>
		
		<div class="row">
			<div class="col-md-5">
				<button class="btn btn-primary btn-block" type="submit" onclick="login()">会员登录</button>
			</div>
			<div class="col-md-5">
				<button class="btn btn-primary btn-block" type="reset" onclick="reset()">重置</button>
			</div>
			<div class="col-md-5">
				<button class="btn btn-default btn-block" onclick="visitor_login()">游客登录</button>
			</div>
		</div>
	</form>
</body>

<script>
	//登录
	function login(){
		$("#loginForm").validate({ //参数校验：取Form表单的id=loginForm
	        submitHandler:function(form){ //若验证通过，则回调doLogin()方法
	             doLogin();
	        }    
	    });
	}
	
	function visitor_login(){
		window.location.href="/goods/to_list";
	}
	
	function doLogin(){
		g_showLoading(); //显示Loading...框（common.js）
		
		var inputPass = $("#password").val(); //获取用户输入的明文密码
		var salt = g_passsword_salt; //静态的salt，用于第一次MD5，在输入的密码后进行拼接（common.js）
		var str = ""+salt.charAt(0)+salt.charAt(2) + inputPass +salt.charAt(5) + salt.charAt(4); //转换、拼接
		var password = md5(str); //做一次MD5
		
		//提交
		$.ajax({
			url: "/login/do_login",
		    type: "POST",
		    data:{
		    	mobile:$("#mobile").val(), //获取用户输入的手机号
		    	password: password  //计算2次MD5后的加密密码
		    },
		    //提交成功后的回调方法
		    success:function(data){ //成功后会返回data
		    	layer.closeAll(); //关闭Loading...框
		    	console.log(data);
		    	if(data.code == 0){
		    		layer.msg("成功");
		    		window.location.href="/goods/to_list"; //用户登录后跳转到商品列表页goods_list.html
		    	}else{
		    		layer.msg(data.msg);
		    	}
		    },
			//提交失败后的回调方法
		    error:function(){
		    	layer.closeAll(); //关闭Loading...框
		    }
		});
	}
</script>
</html>
